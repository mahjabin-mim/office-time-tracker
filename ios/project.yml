# Generate the Xcode project with XcodeGen (brew install xcodegen), then open it:
#   cd ios && xcodegen && open OfficeTimeTracker.xcodeproj
name: OfficeTimeTracker
options:
  bundleIdPrefix: app.vercel.officetimetracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OfficeTimeTracker:
    type: application
    platform: iOS
    # A shared scheme, so CI can build with xcodebuild -scheme
    scheme: {}
    sources:
      - path: OfficeTimeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vercel.officetimetracker.ios
        PRODUCT_NAME: OfficeTimeTracker
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Server the app talks to. For local development point it at your Mac, e.g.
        # http://localhost:3001 in the simulator, or http://<your-mac's-LAN-IP>:3001 on a phone.
        API_BASE_URL: https://officetimetracker.vercel.app
    info:
      path: OfficeTimeTracker/Info.plist
      properties:
        CFBundleDisplayName: Time Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APIBaseURL: $(API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # Lets a Debug build reach a dev server over plain http on your local network.
          NSAllowsLocalNetworking: true

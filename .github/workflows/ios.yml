name: iOS

on:
  # Any branch, so iOS work gets a build before it has a pull request.
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen
      # Unsigned, so it needs no certificate. Sideloadly or AltStore signs it with the installer's
      # own Apple ID (see "Native iOS app" in the README).
      - name: Build for iPhone
        working-directory: ios
        run: >
          xcodebuild archive
          -project OfficeTimeTracker.xcodeproj
          -scheme OfficeTimeTracker
          -destination 'generic/platform=iOS'
          -archivePath build/OfficeTimeTracker.xcarchive
          CODE_SIGNING_ALLOWED=NO
      - name: Package the .ipa
        working-directory: ios/build
        run: |
          mkdir Payload
          cp -R OfficeTimeTracker.xcarchive/Products/Applications/OfficeTimeTracker.app Payload/
          zip -qry OfficeTimeTracker.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeTimeTracker-ipa
          path: ios/build/OfficeTimeTracker.ipa
          if-no-files-found: error

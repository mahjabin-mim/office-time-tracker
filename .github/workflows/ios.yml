name: iOS

on:
  push:
    branches: [master]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen
      # A simulator build needs no signing certificate.
      - name: Build
        working-directory: ios
        run: >
          xcodebuild build
          -project OfficeTimeTracker.xcodeproj
          -scheme OfficeTimeTracker
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

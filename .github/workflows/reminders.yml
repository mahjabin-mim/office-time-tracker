# Calls the app every 5 minutes so it can send push reminders (clock in / time to leave /
# clock out) even when nobody has it open. Vercel's free plan only allows daily cron jobs.
#
# Needs two repository secrets: APP_URL (e.g. https://officetimetracker.vercel.app) and
# CRON_SECRET (the same value as the app's CRON_SECRET environment variable).
name: Send reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger reminder check
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reminders"

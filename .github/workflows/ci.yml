name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["ios/**", "android/**"]
  pull_request:
    paths-ignore: ["ios/**", "android/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # postinstall runs `prisma generate`, which needs no database
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
